name: Build KExp v1 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download uploaded project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-24.04 runner already includes Android SDK 35.
      # Avoid android-actions/setup-android@v3 and the removed SDK 'tools' package.
      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -e
          echo "Android SDK: ${ANDROID_HOME:-not set}"
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo 'ERROR: Android API 35 is missing on this runner.'
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || {
            echo 'ERROR: Android Build Tools 35.0.0 is missing on this runner.'
            exit 1
          }
          echo 'Android SDK 35 and Build Tools 35.0.0 are available.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip KExp v1 source
        shell: bash
        run: |
          set -e
          unzip -q KryptekPn_Expenses_v1_AndroidStudio.zip -d workspace
          test -f workspace/KryptekPn_Expenses_v1/app/build.gradle

      - name: Generate installable debug APK
        working-directory: workspace/KryptekPn_Expenses_v1
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: KExp-v1-APK
          path: workspace/KryptekPn_Expenses_v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
